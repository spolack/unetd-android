org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Package name. This is load-bearing beyond the usual: wireguard-go bakes its
# UAPI socket directory in at link time as /data/data/<pkg>/cache/wireguard, and
# unetd must be built with a matching RUNSTATEDIR. See README.
unetd.packageName=org.unetd.android
