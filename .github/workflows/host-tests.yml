name: host tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  m0-uapi-hinge:
    name: unetd drives wireguard-go over UAPI
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: native/libwg-go/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libjson-c-dev

      # The runner kernel has IPv6, unlike some dev containers, so unetd's
      # AF_INET6 global PEX socket can actually bind here.
      - name: Report IPv6 availability
        run: |
          python3 - <<'PY'
          import socket
          try:
              socket.socket(socket.AF_INET6, socket.SOCK_DGRAM).close()
              print("AF_INET6: available")
          except OSError as e:
              print("AF_INET6: UNAVAILABLE ->", e)
          PY

      - name: Apply the patch series
        run: ./scripts/apply-patches.sh

      - name: Build unetd (Android configuration) and wireguard-go
        run: ./scripts/build-host.sh

      # The exact CMake project the app builds with the NDK, here for the host:
      # libubox subset + json-c + unetd + the library wrapper + the test program.
      - name: Build the native layer for the host
        run: |
          cmake -S native -B build/native-host -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-host

      - name: M0 - UAPI hinge
        run: |
          sudo ./tests/host/m0-uapi-hinge.sh \
            build/host/unetd third_party/unetd build/host/wireguard-go

      # The library wrapper the app uses, driven the way the VpnService drives
      # it: start, add, status, interface update, remove, stop -- twice in one
      # process. With IPv6 here the global PEX socket opens and the protect()
      # hook has to fire for it.
      - name: M1a - unetd as a library, start/stop twice in one process
        run: |
          sudo ./tests/host/m1-core.sh \
            build/native-host/core-test third_party/unetd build/host/wireguard-go

      - name: Build the private DHT node
        run: cc -O2 -I third_party/unetd -o build/host/dhtnode tests/dht/dhtnode.c third_party/unetd/dht.c

      # The app's unet-dht does not own a UDP socket: it hands its packets to
      # unetd over the control socket, which sends them from the global PEX
      # socket and feeds replies back. That relay inside the library wrapper
      # (not the unetd binary) is what this checks: a ping to a DHT node gets
      # its pong.
      - name: M1b - the library wrapper relays unet-dht through its control socket
        run: |
          sudo ./tests/host/m1b-dht-relay.sh \
            build/native-host/core-test third_party/unetd build/host

      # M1: DHT rendezvous with both ends behind NAT. Two unetd nodes in network
      # namespaces, each behind its own MASQUERADE router, a private DHT of ten
      # nodes on the "internet" between them; the phone side knows only its key
      # and the network's public key and has to find the gateway through the
      # DHT, fetch the signed data over PEX and bring WireGuard up through both
      # NATs.
      - name: M1 - DHT discovery through two NATs
        run: |
          sudo apt-get install -y -qq iptables conntrack >/dev/null
          sudo ./tests/dht/nat-testbed.sh "$PWD/build/host" /tmp/unetd-nat-testbed

      - name: Upload M1 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-dht-nat-logs
          path: |
            /tmp/unetd-nat-testbed/*/*.log
            /tmp/unetd-nat-testbed/dht/*.log
          if-no-files-found: ignore

      # Informational: the real public DHT, from the runner. Tells whether
      # the bootstrap routers answer unet-dht's ping at all today, which a
      # phone's log alone cannot (carriers filter UDP/6881 at times).
      - name: Public DHT - do the bootstrap routers answer unet-dht?
        continue-on-error: true
        run: ./tests/host/public-dht.sh "$PWD/build/host" 45

      - name: M0 - same, with CAP_NET_RAW dropped
        # Proves the raw-socket degradation patch: an unprivileged Android app
        # can never get CAP_NET_RAW, so unetd must still configure WireGuard
        # without it. Unpatched, pex_open() bails and pex_socket() returns fd 0.
        run: |
          sudo apt-get install -y -qq libcap2-bin
          sudo capsh --drop=cap_net_raw --caps="cap_net_admin+eip cap_setpcap,cap_setuid,cap_setgid+ep" \
            --keep=1 --user=root --addamb=cap_net_admin -- \
            -c './tests/host/m0-uapi-hinge.sh build/host/unetd third_party/unetd build/host/wireguard-go'
