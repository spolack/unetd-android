name: android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Latest GA JDK, per the repo policy. Gradle 9.8 is the first release that
      # runs on Java 27; the app still compiles to Java 17 bytecode.
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"

      # Accepts the SDK licences. The platform and build-tools come from
      # compileSdk/buildToolsVersion in app/build.gradle.kts, which AGP installs
      # on demand, so that file stays the single source of truth for both.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Report APK size
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$apk"
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(basename "$apk")\` — $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  lint:
    name: Lint and unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Latest GA JDK, per the repo policy. Gradle 9.8 is the first release that
      # runs on Java 27; the app still compiles to Java 17 bytecode.
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-and-test-reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
