name: android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug and release APKs
    runs-on: ubuntu-26.04
    # The secrets context is not available in step conditions, so the keystore
    # secret is mapped into the job environment and the step tests that.
    env:
      UNETD_KEYSTORE_BASE64: ${{ secrets.UNETD_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Latest GA JDK, per the repo policy. Gradle 9.8 is the first release that
      # runs on Java 27; the app still compiles to Java 17 bytecode.
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"

      # libwg-go (wireguard-go) is cross-compiled by Go from inside the CMake
      # build, with the NDK's clang as the C compiler.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: native/libwg-go/go.sum

      # Accepts the SDK licences. The platform, build-tools, NDK and CMake come
      # from app/build.gradle.kts, which AGP installs on demand, so that file
      # stays the single source of truth for all of them.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # unetd and wireguard-go are pristine upstream submodules; the Android
      # changes are a patch series applied at build time.
      - name: Apply the patch series
        run: ./scripts/apply-patches.sh

      # The release signing key lives in repository secrets (see README). When
      # they are present, debug and release are signed with the same key so any
      # CI APK updates any other in place; without them (forks, PRs) the build
      # still runs, with the default debug key and an unsigned release.
      - name: Set up signing
        if: ${{ env.UNETD_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$UNETD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/unetd-release.jks"
          {
            echo "UNETD_KEYSTORE_FILE=$RUNNER_TEMP/unetd-release.jks"
            echo "UNETD_KEYSTORE_PASSWORD=${{ secrets.UNETD_KEYSTORE_PASSWORD }}"
            echo "UNETD_KEY_ALIAS=${{ secrets.UNETD_KEY_ALIAS }}"
            echo "UNETD_KEY_PASSWORD=${{ secrets.UNETD_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "signing key configured"

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Report APKs
        run: |
          echo "### APKs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release*.apk; do
            ls -l "$apk"
            echo "\`$(basename "$apk")\` — $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release*.apk 2>&1 \
            | grep -i "SHA-256\|DOES NOT VERIFY\|not signed" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/apk && cd /tmp/apk
          unzip -o -q "$GITHUB_WORKSPACE"/app/build/outputs/apk/release/app-release*.apk 'lib/*'
          echo "### Native libraries (release)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find lib -type f -printf '%-40p %10s bytes\n' | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

  lint:
    name: Lint and unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Latest GA JDK, per the repo policy. Gradle 9.8 is the first release that
      # runs on Java 27; the app still compiles to Java 17 bytecode.
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: native/libwg-go/go.sum

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply the patch series
        run: ./scripts/apply-patches.sh

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-and-test-reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
